name: Deploy to GitHub Pages

# Static site — no build step. Files are served as-authored from the repo root.
# The only build-time mutation is sed-replacing the __UMAMI_WEBSITE_ID__
# placeholder in every HTML file with the value of the PUBLIC_UMAMI_WEBSITE_ID
# secret. If the secret is unset, the placeholder is left in place and Umami
# is effectively disabled (the script tag still loads but tracks no website).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Umami website ID
        env:
          # Set at github.com/jhomer192/jhomer192.github.io/settings/secrets/actions
          # with the Website ID from cloud.umami.is (Settings → Websites).
          UMAMI_ID: ${{ secrets.PUBLIC_UMAMI_WEBSITE_ID }}
        run: |
          if [ -n "$UMAMI_ID" ]; then
            find . -name '*.html' -not -path './node_modules/*' -not -path './.git/*' \
              -exec sed -i "s/__UMAMI_WEBSITE_ID__/${UMAMI_ID}/g" {} +
            echo "Umami ID injected into HTML files."
          else
            echo "No PUBLIC_UMAMI_WEBSITE_ID set — leaving placeholder; analytics disabled."
          fi

      - name: Stage static files
        run: |
          mkdir -p _site
          # Copy everything that should be served. Skip dev/source/CI/git stuff.
          rsync -a \
            --exclude='_site' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='src' \
            --exclude='dist' \
            --exclude='public' \
            --exclude='.astro' \
            --exclude='.vscode' \
            --exclude='package*.json' \
            --exclude='tsconfig.json' \
            --exclude='astro.config.*' \
            --exclude='*.md' \
            ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
